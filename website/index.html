<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Mob Arena - Live Stats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header h2 {
            font-size: 1.5em;
            font-weight: 300;
            opacity: 0.9;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .api-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .api-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .leaderboard-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .leaderboard-table {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .leaderboard-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .leaderboard-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }

        .leaderboard-table tr:hover {
            background: #f5f5f5;
        }

        .leaderboard-table tr:nth-child(1) {
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 100%);
            font-weight: bold;
        }

        .leaderboard-table tr:nth-child(2) {
            background: linear-gradient(90deg, #c0c0c0 0%, #e8e8e8 100%);
            font-weight: bold;
        }

        .leaderboard-table tr:nth-child(3) {
            background: linear-gradient(90deg, #cd7f32 0%, #e8b88a 100%);
            font-weight: bold;
        }

        .rank {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .rank.gold { color: #b8860b; font-size: 1.5em; }
        .rank.silver { color: #708090; font-size: 1.4em; }
        .rank.bronze { color: #8b4513; font-size: 1.3em; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #d32f2f;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            margin: 20px 0;
        }

        .error h3 {
            margin-bottom: 15px;
        }

        .error p {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            header {
                margin-bottom: 20px;
                padding: 20px 15px;
            }

            header h1 {
                font-size: 2em;
            }

            header h2 {
                font-size: 1.2em;
            }

            .button-group {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .api-button {
                padding: 15px;
                font-size: 1em;
            }

            .stats-summary {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 10px;
                margin-bottom: 20px;
            }

            .stat-card {
                padding: 20px 10px;
            }

            .stat-value {
                font-size: 1.8em;
            }

            .stat-label {
                font-size: 0.85em;
            }

            .leaderboard-table {
                font-size: 0.85em;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 10px 8px;
                white-space: nowrap;
            }

            .rank {
                font-size: 1.1em;
            }

            .rank.gold { font-size: 1.3em; }
            .rank.silver { font-size: 1.2em; }
            .rank.bronze { font-size: 1.1em; }

            footer {
                margin-top: 20px;
                padding: 15px;
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5em;
            }

            header h2 {
                font-size: 1em;
            }

            .stats-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-value {
                font-size: 1.5em;
            }

            .stat-label {
                font-size: 0.75em;
            }

            .leaderboard-table {
                font-size: 0.75em;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 8px 5px;
            }

            footer p {
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Legion Mob Arena</h1>
            <h2>Live Stats Dashboard</h2>
        </header>

        <div class="button-group">
            <button class="api-button" onclick="loadAllPlayers()">
                📊 Arena Stats - All Players
            </button>
            <button class="api-button" onclick="loadLeaderboard()">
                🏆 Top 10 Leaderboard
            </button>
        </div>

        <div id="content"></div>

        <footer>
            <p>Auto-refreshing every 30 seconds • Legion Mob Arena</p>
            <p style="margin-top: 5px; font-size: 0.9em;">Last updated: <span id="lastUpdate">-</span></p>
        </footer>
    </div>

    <!-- Load configuration first -->
    <script src="config.js" onerror="handleConfigError()"></script>

    <script>
        let autoRefreshInterval = null;
        let configLoaded = false;

        // Function to handle config.js loading error
        function handleConfigError() {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h3>❌ config.js Not Found</h3>
                    <p><strong>The configuration file could not be loaded!</strong></p>
                    <p><strong>Solutions:</strong></p>
                    <p>1. Make sure <code>config.js</code> is in the same folder as <code>index.html</code></p>
                    <p>2. If testing locally, use a local web server (not file://)</p>
                    <p>3. If on InfinityFree, make sure you uploaded BOTH files:</p>
                    <p>&nbsp;&nbsp;&nbsp;• index.html</p>
                    <p>&nbsp;&nbsp;&nbsp;• config.js</p>
                    <p style="margin-top: 15px; padding: 10px; background: #fff3cd; color: #856404; border-radius: 5px;">
                        <strong>Testing locally?</strong><br>
                        Use: <code>python -m http.server 8000</code><br>
                        Then visit: <code>http://localhost:8000</code>
                    </p>
                </div>
            `;
        }

        // Check if config is properly set
        if (typeof CONFIG !== 'undefined') {
            configLoaded = true;
            if (CONFIG.API_BASE_URL === 'http://YOUR-SERVER-IP:25566') {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h3>⚠️ Configuration Required</h3>
                        <p><strong>Please update config.js with your server's IP address!</strong></p>
                        <p>1. Open <code>config.js</code> in a text editor</p>
                        <p>2. Replace <code>YOUR-SERVER-IP</code> with your actual server IP</p>
                        <p>3. Example: <code>API_BASE_URL: 'http://123.45.67.89:25566'</code></p>
                        <p>4. Make sure the API is enabled in your server's config.yml</p>
                        <p>5. Ensure port 25566 is open in your firewall</p>
                    </div>
                `;
            }
        }

        async function fetchAPI(endpoint) {
            if (typeof CONFIG === 'undefined') {
                throw new Error('Configuration not loaded');
            }
            const url = CONFIG.API_BASE_URL + endpoint;
            const response = await fetch(url);
            if (!response.ok) throw new Error('Failed to fetch from ' + url);
            return await response.json();
        }

        function startAutoRefresh(viewFunction) {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            const interval = (typeof CONFIG !== 'undefined' && CONFIG.REFRESH_INTERVAL) ? CONFIG.REFRESH_INTERVAL : 30000;
            autoRefreshInterval = setInterval(viewFunction, interval);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof CONFIG !== 'undefined' && CONFIG.API_BASE_URL !== 'http://YOUR-SERVER-IP:25566') {
                loadAllPlayers();
            }
        });

        async function loadAllPlayers() {
            startAutoRefresh(loadAllPlayers);

            try {
                const stats = await fetchAPI('/api/stats');
                const players = await fetchAPI('/api/leaderboard');

                let html = `
                    <div class="stats-summary">
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalPlayers.toLocaleString()}</div>
                            <div class="stat-label">Total Players</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalGames.toLocaleString()}</div>
                            <div class="stat-label">Games Played</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(stats.totalGamesWon || 0).toLocaleString()}</div>
                            <div class="stat-label">Games Won</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalKills.toLocaleString()}</div>
                            <div class="stat-label">Total Kills</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(stats.totalDeaths || 0).toLocaleString()}</div>
                            <div class="stat-label">Total Deaths</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(stats.totalGems || 0).toLocaleString()}</div>
                            <div class="stat-label">Total Gems</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.highestRound.toLocaleString()}</div>
                            <div class="stat-label">Highest Round</div>
                        </div>
                    </div>
                `;

                if (!players || players.length === 0) {
                    html += '<div class="loading">No players yet! Be the first to play!</div>';
                } else {
                    html += `
                        <div class="leaderboard-container">
                            <div class="table-wrapper">
                            <table class="leaderboard-table">
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>Player</th>
                                        <th>Round</th>
                                        <th>Games</th>
                                        <th>Won</th>
                                        <th>Win%</th>
                                        <th>Kills</th>
                                        <th>Deaths</th>
                                        <th>K/D</th>
                                        <th>Gems</th>
                                        <th>Kits</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    players.forEach((player, index) => {
                        const rank = index + 1;
                        let rankClass = '';
                        let rankDisplay = `#${rank}`;

                        if (rank === 1) { rankClass = 'gold'; rankDisplay = '🥇'; }
                        else if (rank === 2) { rankClass = 'silver'; rankDisplay = '🥈'; }
                        else if (rank === 3) { rankClass = 'bronze'; rankDisplay = '🥉'; }

                        html += `
                            <tr>
                                <td><span class="rank ${rankClass}">${rankDisplay}</span></td>
                                <td><strong>${player.playerName}</strong></td>
                                <td><strong style="color: #667eea;">${player.highestRound}</strong></td>
                                <td>${player.totalGamesPlayed}</td>
                                <td>${player.gamesWon || 0}</td>
                                <td>${(player.winRate || 0).toFixed(1)}%</td>
                                <td>${player.totalKills}</td>
                                <td>${player.totalDeaths || 0}</td>
                                <td>${(player.kdr || 0).toFixed(2)}</td>
                                <td>${player.totalGemsEarned}</td>
                                <td>${player.unlockedKits || 0}</td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table></div></div>';
                }

                document.getElementById('content').innerHTML = html;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                const apiUrl = (typeof CONFIG !== 'undefined') ? CONFIG.API_BASE_URL : 'Not configured';
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h3>❌ Failed to load stats</h3>
                        <p><strong>Cannot connect to the server API</strong></p>
                        <p>Please check:</p>
                        <p>1. Your server is online and running</p>
                        <p>2. API is enabled in config.yml</p>
                        <p>3. Server URL: <code>${apiUrl}</code></p>
                        <p>4. Port 25566 is open in firewall/port forwarding</p>
                        <p style="margin-top: 15px; font-size: 0.9em; color: #666;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function loadLeaderboard() {
            startAutoRefresh(loadLeaderboard);

            try {
                const players = await fetchAPI('/api/leaderboard');

                if (!players || players.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="loading">No players yet!</div>';
                    return;
                }

                const topPlayers = players.slice(0, 10);

                let html = `
                    <div class="leaderboard-container">
                        <div class="table-wrapper">
                        <table class="leaderboard-table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Player</th>
                                    <th>Round</th>
                                    <th>Games</th>
                                    <th>Won</th>
                                    <th>Win%</th>
                                    <th>Kills</th>
                                    <th>Deaths</th>
                                    <th>K/D</th>
                                    <th>Gems</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                topPlayers.forEach((player, index) => {
                    const rank = index + 1;
                    let rankClass = '';
                    let rankDisplay = `#${rank}`;

                    if (rank === 1) { rankClass = 'gold'; rankDisplay = '🥇'; }
                    else if (rank === 2) { rankClass = 'silver'; rankDisplay = '🥈'; }
                    else if (rank === 3) { rankClass = 'bronze'; rankDisplay = '🥉'; }

                    html += `
                        <tr>
                            <td><span class="rank ${rankClass}">${rankDisplay}</span></td>
                            <td><strong>${player.playerName}</strong></td>
                            <td><strong style="color: #667eea;">${player.highestRound}</strong></td>
                            <td>${player.totalGamesPlayed}</td>
                            <td>${player.gamesWon || 0}</td>
                            <td>${(player.winRate || 0).toFixed(1)}%</td>
                            <td>${player.totalKills}</td>
                            <td>${player.totalDeaths || 0}</td>
                            <td>${(player.kdr || 0).toFixed(2)}</td>
                            <td>${player.totalGemsEarned}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table></div></div>';

                if (players.length > 10) {
                    html += `<div style="text-align: center; margin-top: 20px; color: white;">
                        Showing top 10 of ${players.length} players
                    </div>`;
                }

                document.getElementById('content').innerHTML = html;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                const apiUrl = (typeof CONFIG !== 'undefined') ? CONFIG.API_BASE_URL : 'Not configured';
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h3>❌ Failed to load leaderboard</h3>
                        <p><strong>Cannot connect to the server API</strong></p>
                        <p>Server URL: <code>${apiUrl}</code></p>
                        <p style="margin-top: 15px; font-size: 0.9em; color: #666;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
