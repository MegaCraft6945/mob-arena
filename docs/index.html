<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Mob Arena - Live Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header h2 {
            font-size: 1.5em;
            font-weight: 300;
            opacity: 0.9;
        }

        .config-panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .config-panel h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .config-panel input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 10px;
        }

        .config-panel button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .config-panel button:hover {
            transform: translateY(-2px);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .leaderboard-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .leaderboard-header {
            display: grid;
            grid-template-columns: 80px 1fr 120px 100px 100px 100px;
            gap: 15px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }

        .leaderboard-body {
            max-height: 600px;
            overflow-y: auto;
        }

        .leaderboard-row {
            display: grid;
            grid-template-columns: 80px 1fr 120px 100px 100px 100px;
            gap: 15px;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
            align-items: center;
        }

        .leaderboard-row:hover {
            background: #f5f5f5;
        }

        .leaderboard-row:nth-child(1) {
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 100%);
            font-weight: bold;
        }

        .leaderboard-row:nth-child(2) {
            background: linear-gradient(90deg, #c0c0c0 0%, #e8e8e8 100%);
            font-weight: bold;
        }

        .leaderboard-row:nth-child(3) {
            background: linear-gradient(90deg, #cd7f32 0%, #e8b88a 100%);
            font-weight: bold;
        }

        .rank {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
        }

        .leaderboard-row:nth-child(1) .rank {
            color: #b8860b;
            font-size: 2em;
        }

        .leaderboard-row:nth-child(2) .rank {
            color: #708090;
            font-size: 1.8em;
        }

        .leaderboard-row:nth-child(3) .rank {
            color: #8b4513;
            font-size: 1.6em;
        }

        .player-name {
            font-weight: 600;
            font-size: 1.1em;
        }

        .round-col, .games-col, .kills-col, .gems-col {
            text-align: center;
            font-weight: 500;
        }

        .round-value {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        .loading, .error {
            padding: 40px;
            text-align: center;
            font-size: 1.1em;
        }

        .loading {
            color: #666;
        }

        .error {
            color: #d32f2f;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.9;
        }

        footer p {
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            header h2 {
                font-size: 1.2em;
            }

            .leaderboard-header,
            .leaderboard-row {
                grid-template-columns: 50px 1fr 80px 70px;
                gap: 10px;
                padding: 15px 10px;
                font-size: 0.85em;
            }

            .kills-col, .gems-col {
                display: none;
            }

            .stat-value {
                font-size: 2em;
            }

            .stat-card {
                padding: 20px;
            }
        }

        .leaderboard-body::-webkit-scrollbar {
            width: 10px;
        }

        .leaderboard-body::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .leaderboard-body::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }

        .leaderboard-body::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Legion Mob Arena</h1>
            <h2>Live Leaderboard</h2>
        </header>

        <div class="config-panel">
            <h3>⚙️ Server Configuration</h3>
            <input type="text" id="apiUrl" placeholder="Enter API URL (e.g., http://yourserver.com:8080)">
            <button onclick="saveConfig()">Connect to Server</button>
        </div>

        <div class="stats-summary" id="statsSummary">
            <div class="stat-card">
                <div class="stat-value" id="totalPlayers">-</div>
                <div class="stat-label">Total Players</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalGames">-</div>
                <div class="stat-label">Games Played</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalKills">-</div>
                <div class="stat-label">Total Kills</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="highestRound">-</div>
                <div class="stat-label">Highest Round</div>
            </div>
        </div>

        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <div class="rank-col">Rank</div>
                <div class="player-col">Player</div>
                <div class="round-col">Best Round</div>
                <div class="games-col">Games</div>
                <div class="kills-col">Kills</div>
                <div class="gems-col">Gems</div>
            </div>
            <div class="leaderboard-body" id="leaderboardBody">
                <div class="loading">Please configure the API URL above to connect to your server.</div>
            </div>
        </div>

        <footer>
            <p>Last Updated: <span id="lastUpdated">-</span></p>
            <p>Auto-refreshes every 60 seconds</p>
        </footer>
    </div>

    <script>
        let apiBaseUrl = localStorage.getItem('apiBaseUrl') || '';

        // Load saved API URL on page load
        window.addEventListener('DOMContentLoaded', () => {
            if (apiBaseUrl) {
                document.getElementById('apiUrl').value = apiBaseUrl;
                loadData();
            }
        });

        function saveConfig() {
            const url = document.getElementById('apiUrl').value.trim();
            if (!url) {
                alert('Please enter a valid API URL');
                return;
            }
            apiBaseUrl = url.replace(/\/$/, ''); // Remove trailing slash
            localStorage.setItem('apiBaseUrl', apiBaseUrl);
            loadData();
        }

        async function loadData() {
            if (!apiBaseUrl) return;

            try {
                // Fetch stats summary
                const statsResponse = await fetch(`${apiBaseUrl}/api/stats`);
                if (!statsResponse.ok) throw new Error('Failed to fetch stats');
                const stats = await statsResponse.json();
                updateStatsSummary(stats);

                // Fetch leaderboard
                const leaderboardResponse = await fetch(`${apiBaseUrl}/api/leaderboard`);
                if (!leaderboardResponse.ok) throw new Error('Failed to fetch leaderboard');
                const leaderboard = await leaderboardResponse.json();
                displayLeaderboard(leaderboard);

                updateLastUpdated();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('leaderboardBody').innerHTML =
                    '<div class="error">Failed to connect to server. Please check the API URL and make sure the server is running.</div>';
            }
        }

        function updateStatsSummary(stats) {
            document.getElementById('totalPlayers').textContent = stats.totalPlayers.toLocaleString();
            document.getElementById('totalGames').textContent = stats.totalGames.toLocaleString();
            document.getElementById('totalKills').textContent = stats.totalKills.toLocaleString();
            document.getElementById('highestRound').textContent = stats.highestRound.toLocaleString();

            // Update header with server name if available
            if (stats.serverName) {
                document.querySelector('header h1').textContent = `⚔️ ${stats.serverName}`;
            }
        }

        function displayLeaderboard(players) {
            const leaderboardBody = document.getElementById('leaderboardBody');

            if (!players || players.length === 0) {
                leaderboardBody.innerHTML = '<div class="loading">No players on the leaderboard yet!</div>';
                return;
            }

            let html = '';
            players.forEach((player, index) => {
                html += `
                    <div class="leaderboard-row">
                        <div class="rank">${getRankDisplay(index + 1)}</div>
                        <div class="player-name">${escapeHtml(player.playerName)}</div>
                        <div class="round-col"><span class="round-value">${player.highestRound}</span></div>
                        <div class="games-col">${player.totalGamesPlayed.toLocaleString()}</div>
                        <div class="kills-col">${player.totalKills.toLocaleString()}</div>
                        <div class="gems-col">${player.totalGemsEarned.toLocaleString()}</div>
                    </div>
                `;
            });

            leaderboardBody.innerHTML = html;
        }

        function getRankDisplay(rank) {
            if (rank === 1) return '🥇';
            if (rank === 2) return '🥈';
            if (rank === 3) return '🥉';
            return `#${rank}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateLastUpdated() {
            const now = new Date();
            const formatted = now.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('lastUpdated').textContent = formatted;
        }

        // Auto-refresh every 60 seconds
        setInterval(() => {
            if (apiBaseUrl) {
                loadData();
            }
        }, 60000);
    </script>
</body>
</html>
