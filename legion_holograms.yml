# ============================================================
# Legion Mob Arena - DecentHolograms Configuration
# ============================================================
#
# Instructions:
# 1. Place this file in: plugins/DecentHolograms/holograms/
# 2. Rename it to: legion_stats.yml (or any name you prefer)
# 3. Set the location where you want the holograms to appear
# 4. Reload DecentHolograms with: /dh reload
#
# Location Format:
# Change the 'location' values below to your desired coordinates
# Format: world:x:y:z
# Example: world:0:100:0
# ============================================================

# ============================================================
# TOP KILLS LEADERBOARD
# ============================================================
legion_top_kills:
  enabled: true
  # CHANGE THIS LOCATION TO WHERE YOU WANT THE HOLOGRAM
  location: world:0:100:0
  down-origin: false
  display-range: 48
  update-range: 48
  update-interval: 100
  pages:
    1:
      lines:
        # Header
        - '&8&m━━━━━━━━━━━━━━━━━━━━━━'
        - '&6&l⚔ TOP KILLS ⚔'
        - '&8&m━━━━━━━━━━━━━━━━━━━━━━'
        - ''
        # Top 10 players
        - '&e#1 &f%legion_top_kills_1_name% &7- &a%legion_top_kills_1_value%'
        - '&e#2 &f%legion_top_kills_2_name% &7- &a%legion_top_kills_2_value%'
        - '&e#3 &f%legion_top_kills_3_name% &7- &a%legion_top_kills_3_value%'
        - '&e#4 &f%legion_top_kills_4_name% &7- &a%legion_top_kills_4_value%'
        - '&e#5 &f%legion_top_kills_5_name% &7- &a%legion_top_kills_5_value%'
        - '&e#6 &f%legion_top_kills_6_name% &7- &a%legion_top_kills_6_value%'
        - '&e#7 &f%legion_top_kills_7_name% &7- &a%legion_top_kills_7_value%'
        - '&e#8 &f%legion_top_kills_8_name% &7- &a%legion_top_kills_8_value%'
        - '&e#9 &f%legion_top_kills_9_name% &7- &a%legion_top_kills_9_value%'
        - '&e#10 &f%legion_top_kills_10_name% &7- &a%legion_top_kills_10_value%'
        - ''
        - '&8&m━━━━━━━━━━━━━━━━━━━━━━'

