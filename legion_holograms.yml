# ============================================================
# Legion Mob Arena - DecentHolograms Configuration
# ============================================================
#
# Instructions:
# 1. Place this file in: plugins/DecentHolograms/holograms/
# 2. Rename it to: legion_stats.yml (or any name you prefer)
# 3. Change the location values to your desired coordinates
# 4. Reload DecentHolograms with: /dh reload
#
# Location Format: world:x:y:z
# Example: world:-53.500:-59.000:38.500
# ============================================================

# ============================================================
# TOP KILLS LEADERBOARD
# ============================================================
legion_top_kills:
  location: world:0.500:100.000:0.500
  enabled: true
  display-range: 48
  update-range: 48
  update-interval: 20
  facing: 0.0
  down-origin: false
