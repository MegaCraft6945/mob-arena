# ============================================================
# PLAYER STATS HOLOGRAM (OPTIONAL)
# ============================================================
# This shows individual player stats when they're nearby
legion_player_stats:
  enabled: false
  # CHANGE THIS LOCATION TO WHERE YOU WANT THE HOLOGRAM
  location: world:30:100:0
  down-origin: false
  display-range: 48
  update-range: 48
  update-interval: 20
  pages:
    1:
      lines:
        - '&8&m━━━━━━━━━━━━━━━━━━━━━━'
        - '&6&lYour Legion Stats'
        - '&8&m━━━━━━━━━━━━━━━━━━━━━━'
        - ''
        - '&eGems: &a%legion_gems%'
        - '&eHighest Round: &a%legion_highest_round%'
        - '&eTotal Kills: &a%legion_kills%'
        - '&eTotal Deaths: &a%legion_deaths%'
        - '&eK/D Ratio: &a%legion_kdr%'
        - ''
        - '&eGames Played: &a%legion_games_played%'
        - '&eGames Won: &a%legion_wins%'
        - '&eWin Rate: &a%legion_winrate%%'
        - ''
        - '&eUnlocked Kits: &a%legion_unlocked_kits%&7/&a9'
        - ''
        - '&8&m━━━━━━━━━━━━━━━━━━━━━━'
