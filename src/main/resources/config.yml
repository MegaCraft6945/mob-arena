# Legion Mob Arena Configuration

# Database settings
# IMPORTANT: If you don't have MySQL set up, set 'enabled: false'
# The plugin will work without MySQL but won't save player data between restarts
database:
  enabled: false  # Set to true if you have MySQL configured
  host: localhost
  port: 3306
  database: legion_mobarena
  username: root
  password: password

# Game settings
game:
  max-rounds: 50
  min-players: 1
  max-players: 8
  countdown-seconds: 10

# Round settings (Round 1 template)
rounds:
  round-1:
    mobs: 10
    gems-reward: 5
  # Progression formula: mobs increase by 2 each round, gems increase by 1 every 5 rounds
  mob-increase-per-round: 2
  gem-increase-every-rounds: 5

# Economy settings
economy:
  gold-per-mob: 1
  starting-gold: 0

# Upgrade shop prices
shop:
  helmet:
    base-price: 6
    price-increase: 6
  chestplate:
    base-price: 10
    price-increase: 10
  leggings:
    base-price: 8
    price-increase: 8
  boots:
    base-price: 6
    price-increase: 6
  sword:
    base-price: 15
    price-increase: 15
  bow:
    base-price: 10
    price-increase: 10
  arrows:
    price: 5
    amount: 16
  cake:
    price: 40
  golden-apple:
    price: 10

# Spawn settings
spawn:
  lobby-world: world
  lobby-x: 0
  lobby-y: 64
  lobby-z: 0
  lobby-yaw: 0
  lobby-pitch: 0

# Stats API Settings
# Enables a REST API server for displaying live leaderboard on a website
api:
  enabled: true  # Set to true to enable the Stats API
  port: 25566  # Port for the HTTP server (default: 25566, do NOT use 25565 - that's the Minecraft port!)
  server-name: "Legion Mob Arena"  # Display name for your server

# Note: Messages have been moved to messages.yml
