<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legion Mob Arena - Live Stats</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header h2 {
            font-size: 1.5em;
            font-weight: 300;
            opacity: 0.9;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .api-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .api-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .leaderboard-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .leaderboard-table {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .leaderboard-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .leaderboard-table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            text-align: center;
        }

        .leaderboard-table tr:hover {
            background: #f5f5f5;
        }

        .leaderboard-table tr:nth-child(1) {
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 100%);
            font-weight: bold;
        }

        .leaderboard-table tr:nth-child(2) {
            background: linear-gradient(90deg, #c0c0c0 0%, #e8e8e8 100%);
            font-weight: bold;
        }

        .leaderboard-table tr:nth-child(3) {
            background: linear-gradient(90deg, #cd7f32 0%, #e8b88a 100%);
            font-weight: bold;
        }

        .rank {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .rank.gold { color: #b8860b; font-size: 1.5em; }
        .rank.silver { color: #708090; font-size: 1.4em; }
        .rank.bronze { color: #8b4513; font-size: 1.3em; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2em; }
            .button-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Legion Mob Arena</h1>
            <h2>Live Stats Dashboard</h2>
        </header>

        <div class="button-group">
            <button class="api-button" onclick="loadAllPlayers()">
                📊 Arena Stats - All Players
            </button>
            <button class="api-button" onclick="loadLeaderboard()">
                🏆 Top 10 Leaderboard
            </button>
        </div>

        <div id="content"></div>

        <footer>
            <p>Auto-refreshing every 30 seconds • Legion Mob Arena</p>
            <p style="margin-top: 5px; font-size: 0.9em;">Last updated: <span id="lastUpdate">-</span></p>
        </footer>
    </div>

    <script>
        let autoRefreshInterval = null;

        async function fetchAPI(endpoint) {
            const response = await fetch(endpoint);
            if (!response.ok) throw new Error('Failed to fetch');
            return await response.json();
        }

        function startAutoRefresh(viewFunction) {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(viewFunction, 30000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadAllPlayers();
        });

        async function loadAllPlayers() {
            startAutoRefresh(loadAllPlayers);

            try {
                const stats = await fetchAPI('/api/stats');
                const players = await fetchAPI('/api/leaderboard');

                let html = `
                    <div class="stats-summary">
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalPlayers.toLocaleString()}</div>
                            <div class="stat-label">Total Players</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalGames.toLocaleString()}</div>
                            <div class="stat-label">Games Played</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(stats.totalGamesWon || 0).toLocaleString()}</div>
                            <div class="stat-label">Games Won</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalKills.toLocaleString()}</div>
                            <div class="stat-label">Total Kills</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(stats.totalDeaths || 0).toLocaleString()}</div>
                            <div class="stat-label">Total Deaths</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${(stats.totalGems || 0).toLocaleString()}</div>
                            <div class="stat-label">Total Gems</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.highestRound.toLocaleString()}</div>
                            <div class="stat-label">Highest Round</div>
                        </div>
                    </div>
                `;

                if (!players || players.length === 0) {
                    html += '<div class="loading">No players yet! Be the first to play!</div>';
                } else {
                    html += `
                        <div class="leaderboard-container">
                            <table class="leaderboard-table">
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>Player</th>
                                        <th>Round</th>
                                        <th>Games</th>
                                        <th>Won</th>
                                        <th>Win%</th>
                                        <th>Kills</th>
                                        <th>Deaths</th>
                                        <th>K/D</th>
                                        <th>Gems</th>
                                        <th>Kits</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    players.forEach((player, index) => {
                        const rank = index + 1;
                        let rankClass = '';
                        let rankDisplay = `#${rank}`;

                        if (rank === 1) { rankClass = 'gold'; rankDisplay = '🥇'; }
                        else if (rank === 2) { rankClass = 'silver'; rankDisplay = '🥈'; }
                        else if (rank === 3) { rankClass = 'bronze'; rankDisplay = '🥉'; }

                        html += `
                            <tr>
                                <td><span class="rank ${rankClass}">${rankDisplay}</span></td>
                                <td><strong>${player.playerName}</strong></td>
                                <td><strong style="color: #667eea;">${player.highestRound}</strong></td>
                                <td>${player.totalGamesPlayed}</td>
                                <td>${player.gamesWon || 0}</td>
                                <td>${(player.winRate || 0).toFixed(1)}%</td>
                                <td>${player.totalKills}</td>
                                <td>${player.totalDeaths || 0}</td>
                                <td>${(player.kdr || 0).toFixed(2)}</td>
                                <td>${player.totalGemsEarned}</td>
                                <td>${player.unlockedKits || 0}</td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table></div>';
                }

                document.getElementById('content').innerHTML = html;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                document.getElementById('content').innerHTML =
                    '<div class="loading" style="color: #d32f2f;">Failed to load stats. Server may be offline.</div>';
            }
        }

        async function loadLeaderboard() {
            startAutoRefresh(loadLeaderboard);

            try {
                const players = await fetchAPI('/api/leaderboard');

                if (!players || players.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="loading">No players yet!</div>';
                    return;
                }

                const topPlayers = players.slice(0, 10);

                let html = `
                    <div class="leaderboard-container">
                        <table class="leaderboard-table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Player</th>
                                    <th>Round</th>
                                    <th>Games</th>
                                    <th>Won</th>
                                    <th>Win%</th>
                                    <th>Kills</th>
                                    <th>Deaths</th>
                                    <th>K/D</th>
                                    <th>Gems</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                topPlayers.forEach((player, index) => {
                    const rank = index + 1;
                    let rankClass = '';
                    let rankDisplay = `#${rank}`;

                    if (rank === 1) { rankClass = 'gold'; rankDisplay = '🥇'; }
                    else if (rank === 2) { rankClass = 'silver'; rankDisplay = '🥈'; }
                    else if (rank === 3) { rankClass = 'bronze'; rankDisplay = '🥉'; }

                    html += `
                        <tr>
                            <td><span class="rank ${rankClass}">${rankDisplay}</span></td>
                            <td><strong>${player.playerName}</strong></td>
                            <td><strong style="color: #667eea;">${player.highestRound}</strong></td>
                            <td>${player.totalGamesPlayed}</td>
                            <td>${player.gamesWon || 0}</td>
                            <td>${(player.winRate || 0).toFixed(1)}%</td>
                            <td>${player.totalKills}</td>
                            <td>${player.totalDeaths || 0}</td>
                            <td>${(player.kdr || 0).toFixed(2)}</td>
                            <td>${player.totalGemsEarned}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table></div>';

                if (players.length > 10) {
                    html += `<div style="text-align: center; margin-top: 20px; color: white;">
                        Showing top 10 of ${players.length} players
                    </div>`;
                }

                document.getElementById('content').innerHTML = html;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                document.getElementById('content').innerHTML =
                    '<div class="loading" style="color: #d32f2f;">Failed to load leaderboard.</div>';
            }
        }
    </script>
</body>
</html>
